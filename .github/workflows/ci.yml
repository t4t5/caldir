name: CI

# On pushes to main, CI runs via workflow_call from release.yml,
# which gates releasing and publishing on it.
on:
  pull_request:
  workflow_call:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: Swatinem/rust-cache@v2

      - name: Run just check
        run: just check

  test:
    strategy:
      fail-fast: false
      matrix:
        # UTC plus one zone east and one west of it, to catch timezone-dependent bugs
        tz: [UTC, Europe/Stockholm, America/New_York]
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: Swatinem/rust-cache@v2

      - name: Run just test
        run: just test
