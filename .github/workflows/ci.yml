name: CI

on:
  pull_request:
  workflow_call:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: Swatinem/rust-cache@v2

      - name: Run just check
        run: just check

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # UTC + one zone east + one zone west (to catch timezone-dependent bugs)
          - os: ubuntu-latest
            tz: UTC
          - os: ubuntu-latest
            tz: Europe/Stockholm
          - os: ubuntu-latest
            tz: America/New_York
          - os: windows-latest
            tz: UTC
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: Swatinem/rust-cache@v2

      - name: Run just test
        run: just test
